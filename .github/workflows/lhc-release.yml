# Fork-owned release pipeline for liminal-ai/t3code-lhc (see FORK.md, Release).
# Dispatch only. Native jobs build linux-x64, darwin-arm64, and win32-x64
# archives, run the scripts tests, and prove the Linux archive on a clean host.
# With promote=true those exact qualified artifacts become the GitHub release
# lhc-v<version> marked latest (the tag is created here, so a tag exists only
# for a promoted build). A second promote dispatch does not rebuild.
name: LHC release

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Create release lhc-v<version> from the qualified artifact and mark it latest"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: lhc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: darwin
            arch: arm64
            runner: macos-14
          - platform: win32
            arch: x64
            runner: windows-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Build archive
        run: node scripts/build-lhc-archive.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Identity
        id: identity
        shell: bash
        run: |
          version="$(node -p 'require("./lhc-release/version.json").version')"
          name="t3code-lhc-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          test -f "dist-lhc/${name}.tar.gz"
          test -f "dist-lhc/${name}.tar.gz.sha256"
          tar -xzf "dist-lhc/${name}.tar.gz" -C dist-lhc manifest.json
          mv dist-lhc/manifest.json "dist-lhc/${name}.manifest.json"
          commit="$(node -p "require('./dist-lhc/${name}.manifest.json').commit")"
          [ "$commit" = "${{ github.sha }}" ] || { echo "manifest commit $commit is not ${{ github.sha }}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          cat "dist-lhc/${name}.tar.gz.sha256"

      - name: Archive unit tests
        if: matrix.platform == 'linux'
        run: vp test run lib/lhc-archive.test.ts
        working-directory: scripts

      - name: Installer tests
        if: matrix.platform == 'linux'
        run: scripts/install-lhc.test.sh

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: t3code-lhc-${{ steps.identity.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-lhc/*.tar.gz
            dist-lhc/*.tar.gz.sha256
            dist-lhc/*.manifest.json
          if-no-files-found: error
          retention-days: 14

  clean_host:
    name: Clean host
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/
            /lhc-release/
          sparse-checkout-cone-mode: false

      - name: Download linux candidate
        uses: actions/download-artifact@v4
        with:
          pattern: t3code-lhc-*-linux-x64
          path: dist-lhc
          merge-multiple: true

      - name: Clean-host proof
        run: |
          version="$(node -p 'require("./lhc-release/version.json").version')"
          scripts/lhc-clean-host-proof.sh "dist-lhc/t3code-lhc-${version}-linux-x64.tar.gz"

  promote:
    name: Promote
    if: ${{ inputs.promote }}
    needs: [candidate, clean_host]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /lhc-release/
          sparse-checkout-cone-mode: false

      - name: Download qualified artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: t3code-lhc-${{ env.VERSION }}-*
          path: dist-lhc
          merge-multiple: true

      - name: Verify exact artifacts
        run: |
          cd dist-lhc
          for name in t3code-lhc-${VERSION}-linux-x64 t3code-lhc-${VERSION}-darwin-arm64 t3code-lhc-${VERSION}-win32-x64; do
            sha256sum -c "${name}.tar.gz.sha256"
            commit="$(node -p "require('./${name}.manifest.json').commit")"
            [ "$commit" = "${{ github.sha }}" ] || { echo "manifest commit $commit is not ${{ github.sha }}"; exit 1; }
            [ "$(node -p "require('./${name}.manifest.json').version")" = "$VERSION" ]
          done

      - name: Refuse an existing tag or release
        run: |
          tag="lhc-v${VERSION}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "tag ${tag} already exists; publish a new -lhc.N version instead"; exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; publish a new -lhc.N version instead"; exit 1
          fi

      - name: Tag the qualified commit
        run: |
          git config user.name "lhc-release"
          git config user.email "lhc-release@users.noreply.github.com"
          git tag -a "lhc-v${VERSION}" "${{ github.sha }}" -m "t3code-lhc ${VERSION}"
          git push origin "refs/tags/lhc-v${VERSION}"

      - name: Create release and mark latest
        run: |
          upstream="$(node -p 'require("./lhc-release/version.json").upstreamTag')"
          base="$(cat lhc-release/BASE)"
          {
            echo "t3code-lhc ${VERSION} (upstream ${upstream}, BASE ${base}), commit ${{ github.sha }}."
            echo
            echo "Install or update: \`scripts/install-lhc.sh\` (see FORK.md). Linux x64, macOS ARM64, Windows x64. Node >= 24.3 and an authenticated Claude Code CLI are prerequisites. The claude-lhc sidecar is in the archive (Node JS entry; no Bun)."
            echo "Qualified by run ${{ github.run_id }}: native archives, scripts tests, Linux clean-host proof; local smoke recorded in the campaign evidence."
          } > notes.md
          gh release create "lhc-v${VERSION}" \
            --target "${{ github.sha }}" \
            --title "t3code-lhc ${VERSION}" \
            --notes-file notes.md \
            --latest \
            dist-lhc/*.tar.gz \
            dist-lhc/*.tar.gz.sha256 \
            dist-lhc/*.manifest.json

  public_check:
    name: Public install check
    if: ${{ inputs.promote }}
    needs: [candidate, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          # package.json is what setup-node reads for the Node version.
          sparse-checkout: |
            /scripts/
            /lhc-release/
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install from releases/latest
        run: |
          prefix="$RUNNER_TEMP/t3code-lhc"
          scripts/install-lhc.sh --prefix "$prefix"
          got="$("$prefix/bin/t3code-lhc" --lhc-version)"
          want="t3code-lhc ${VERSION} (upstream $(node -p 'require("./lhc-release/version.json").upstreamTag'))"
          [ "$got" = "$want" ] || { echo "installed identity [$got] is not [$want]"; exit 1; }
          echo "installed: $got"
          cat "$prefix/receipt.json"
          scripts/install-lhc.sh --prefix "$prefix" | tee second.log
          grep -q "already at ${VERSION}" second.log
