# Fork-owned release pipeline for liminal-ai/t3code-lhc (see FORK.md, Release).
# Dispatch only. Native jobs build linux-x64, darwin-arm64, and win32-x64
# archives, run the scripts tests, and prove the Linux archive on a clean host.
# Promote is a separate dispatch: promote=true plus candidate_run_id of a
# successful same-SHA candidate run. That downloads the frozen three artifacts
# and does not rebuild. Authenticated Mac/Windows lifecycle happens between
# those two dispatches.
name: LHC release

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Create release lhc-v<version> from already-tested artifacts and mark it latest"
        type: boolean
        default: false
      candidate_run_id:
        description: "Successful same-SHA candidate run whose three artifacts to promote (required with promote; skips rebuild)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lhc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Candidate ${{ matrix.platform }}-${{ matrix.arch }}
    if: ${{ inputs.candidate_run_id == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: darwin
            arch: arm64
            runner: macos-14
          - platform: win32
            arch: x64
            runner: windows-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24.3.0
          cache: true
          run-install: true

      - name: npm 11.16 for LHC pin install
        shell: bash
        run: |
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (!(maj===24 && min===3)) { console.error(process.versions.node); process.exit(1); }'
          prefix="${RUNNER_TEMP}/lhc-archive-npm"
          mkdir -p "$prefix"
          # Isolated prefix: do not npm-install inside the T3 pnpm workspace.
          npm install --prefix "$prefix" --no-save --no-fund --no-audit npm@11.16.0
          cli="$prefix/node_modules/npm/bin/npm-cli.js"
          test -f "$cli"
          ver="$(node "$cli" --version)"
          [ "$ver" = "11.16.0" ] || { echo "archive npm is $ver at $cli"; exit 1; }
          echo "LHC_ARCHIVE_NPM=$cli" >> "$GITHUB_ENV"
          echo "archive npm $ver at $cli"

      - name: GNU tar (macOS)
        if: matrix.platform == 'darwin'
        run: |
          brew list gnu-tar >/dev/null 2>&1 || brew install gnu-tar
          echo "LHC_ARCHIVE_TAR=$(brew --prefix gnu-tar)/libexec/gnubin/tar" >> "$GITHUB_ENV"

      - name: GNU tar (Windows Git)
        if: matrix.platform == 'win32'
        shell: bash
        run: |
          echo "LHC_ARCHIVE_TAR=C:/Program Files/Git/usr/bin/tar.exe" >> "$GITHUB_ENV"

      - name: Build archive
        run: node scripts/build-lhc-archive.ts --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Identity
        id: identity
        shell: bash
        run: |
          version="$(node -p 'require("./lhc-release/version.json").version')"
          name="t3code-lhc-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          test -f "dist-lhc/${name}.tar.gz"
          test -f "dist-lhc/${name}.tar.gz.sha256"
          tar -xzf "dist-lhc/${name}.tar.gz" -C dist-lhc manifest.json
          mv dist-lhc/manifest.json "dist-lhc/${name}.manifest.json"
          commit="$(node -p "require('./dist-lhc/${name}.manifest.json').commit")"
          [ "$commit" = "${{ github.sha }}" ] || { echo "manifest commit $commit is not ${{ github.sha }}"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          cat "dist-lhc/${name}.tar.gz.sha256"

      - name: Archive unit tests
        if: matrix.platform == 'linux'
        run: vp test run lib/lhc-archive.test.ts
        working-directory: scripts

      - name: Installer tests
        if: matrix.platform == 'linux'
        run: scripts/install-lhc.test.sh

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: t3code-lhc-${{ steps.identity.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist-lhc/*.tar.gz
            dist-lhc/*.tar.gz.sha256
            dist-lhc/*.manifest.json
          if-no-files-found: error
          retention-days: 14

  clean_host:
    name: Clean host
    if: ${{ inputs.candidate_run_id == '' }}
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/
            /lhc-release/
          sparse-checkout-cone-mode: false

      - name: Download linux candidate
        uses: actions/download-artifact@v4
        with:
          pattern: t3code-lhc-*-linux-x64
          path: dist-lhc
          merge-multiple: true

      - name: Clean-host proof
        run: |
          version="$(node -p 'require("./lhc-release/version.json").version')"
          scripts/lhc-clean-host-proof.sh "dist-lhc/t3code-lhc-${version}-linux-x64.tar.gz"

  installed_host:
    name: Installed ${{ matrix.platform }}-${{ matrix.arch }}
    if: ${{ inputs.candidate_run_id == '' }}
    needs: candidate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: darwin
            arch: arm64
            runner: macos-14
          - platform: win32
            arch: x64
            runner: windows-latest
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /scripts/
            /lhc-release/
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node 24.3
        uses: actions/setup-node@v4
        with:
          node-version: 24.3.0

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          pattern: t3code-lhc-*-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist-lhc
          merge-multiple: true

      - name: Install and prove default sidecar
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./lhc-release/version.json").version')"
          name="t3code-lhc-${version}-${{ matrix.platform }}-${{ matrix.arch }}"
          prefix="$RUNNER_TEMP/t3code-lhc"
          node -e 'const [maj,min]=process.versions.node.split(".").map(Number); if (!(maj===24 && min===3)) { console.error(process.versions.node); process.exit(1); }'
          scripts/install-lhc.sh --prefix "$prefix" --archive "dist-lhc/${name}.tar.gz" --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          got="$("$prefix/bin/t3code-lhc" --lhc-version)"
          want="t3code-lhc ${version} (upstream $(node -p 'require("./lhc-release/version.json").upstreamTag'))"
          [ "$got" = "$want" ] || { echo "installed identity [$got] is not [$want]"; exit 1; }
          test -f "$prefix/current/vendor/claude-lhc/dist/sidecar.js"
          HOME="$RUNNER_TEMP" T3CODE_LHC_HOME="$RUNNER_TEMP/lhc-eof" \
            env -u CLAUDE_LHC_SIDECAR \
            node "$prefix/current/vendor/claude-lhc/dist/sidecar.js" </dev/null
          echo "sidecar stdin-eof: PASS"
          current="$(node scripts/lib/lhc-store.mjs read-current "$prefix")"
          [ "$current" = "$version" ] || { echo "current $current is not $version"; exit 1; }
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            helper="$prefix/current/node_modules/node-pty/prebuilds/darwin-arm64/spawn-helper"
            test -x "$helper"
            node -e '
              const pty=require(process.argv[1]+"/node_modules/node-pty");
              const term=pty.spawn("/bin/sh",["-c","printf ready"],{name:"xterm",cols:40,rows:10});
              let out="";
              term.onData((d)=>{out+=d;});
              term.onExit(({exitCode})=>{
                if(!out.includes("ready")) { console.error("pty produced no output"); process.exit(1); }
                process.exit(exitCode===0?0:1);
              });
            ' "$prefix/current"
            echo "darwin pty spawn: PASS"
          fi
          if [ "${{ matrix.platform }}" = "win32" ]; then
            test -d "$prefix/current/node_modules/@yuuang/ffi-rs-win32-x64-msvc"
            test -d "$prefix/current/node_modules/@ff-labs/fff-bin-win32-x64"
            node -e 'require(process.argv[1]+"/node_modules/@ff-labs/fff-node"); console.log("fff native: PASS")' "$prefix/current"
          fi

  promote:
    name: Promote
    if: ${{ inputs.promote && inputs.candidate_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /lhc-release/
          sparse-checkout-cone-mode: false

      - name: Require frozen candidate run
        run: |
          if [ -z "${CANDIDATE_RUN_ID}" ]; then
            echo "promote=true requires candidate_run_id of a successful same-SHA candidate run; do not rebuild by redispatched promote"
            exit 1
          fi
          conclusion="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion,headSha,event,name --jq '[.conclusion,.headSha,.event,.name] | @tsv')"
          echo "source run: $conclusion"
          head="$(gh run view "$CANDIDATE_RUN_ID" --json headSha --jq .headSha)"
          [ "$head" = "${{ github.sha }}" ] || { echo "candidate_run_id head $head is not ${{ github.sha }}"; exit 1; }
          status="$(gh run view "$CANDIDATE_RUN_ID" --json conclusion --jq .conclusion)"
          [ "$status" = "success" ] || { echo "candidate_run_id conclusion is $status"; exit 1; }

      - name: Download frozen artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: t3code-lhc-*
          path: dist-lhc
          merge-multiple: true
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Identity from frozen artifacts
        id: identity
        run: |
          version="$(node -p 'require("./lhc-release/version.json").version')"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify exact artifacts
        run: |
          cd dist-lhc
          for name in t3code-lhc-${VERSION}-linux-x64 t3code-lhc-${VERSION}-darwin-arm64 t3code-lhc-${VERSION}-win32-x64; do
            sha256sum -c "${name}.tar.gz.sha256"
            commit="$(node -p "require('./${name}.manifest.json').commit")"
            [ "$commit" = "${{ github.sha }}" ] || { echo "manifest commit $commit is not ${{ github.sha }}"; exit 1; }
            [ "$(node -p "require('./${name}.manifest.json').version")" = "$VERSION" ]
          done

      - name: Refuse an existing tag or release
        run: |
          tag="lhc-v${VERSION}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "tag ${tag} already exists; publish a new -lhc.N version instead"; exit 1
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "release ${tag} already exists; publish a new -lhc.N version instead"; exit 1
          fi

      - name: Tag the qualified commit
        run: |
          git config user.name "lhc-release"
          git config user.email "lhc-release@users.noreply.github.com"
          git tag -a "lhc-v${VERSION}" "${{ github.sha }}" -m "t3code-lhc ${VERSION}"
          git push origin "refs/tags/lhc-v${VERSION}"

      - name: Create release and mark latest
        run: |
          upstream="$(node -p 'require("./lhc-release/version.json").upstreamTag')"
          base="$(cat lhc-release/BASE)"
          {
            echo "t3code-lhc ${VERSION} (upstream ${upstream}, BASE ${base}), commit ${{ github.sha }}."
            echo
            echo "Install or update: \`scripts/install-lhc.sh\` (see FORK.md). Linux x64, macOS ARM64, Windows x64. Node >= 24.3 and an authenticated Claude Code CLI are prerequisites. The claude-lhc sidecar is in the archive (Node JS entry; no Bun)."
            echo "Qualified by frozen candidate run ${CANDIDATE_RUN_ID} at ${{ github.sha }}; this promote run ${{ github.run_id }} published those exact bytes."
          } > notes.md
          gh release create "lhc-v${VERSION}" \
            --target "${{ github.sha }}" \
            --title "t3code-lhc ${VERSION}" \
            --notes-file notes.md \
            --latest \
            dist-lhc/*.tar.gz \
            dist-lhc/*.tar.gz.sha256 \
            dist-lhc/*.manifest.json

  public_check:
    name: Public install check
    if: ${{ inputs.promote }}
    needs: [promote]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.promote.outputs.version }}
    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          # package.json is what setup-node reads for the Node version.
          sparse-checkout: |
            /scripts/
            /lhc-release/
            /package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install from releases/latest
        run: |
          prefix="$RUNNER_TEMP/t3code-lhc"
          scripts/install-lhc.sh --prefix "$prefix"
          got="$("$prefix/bin/t3code-lhc" --lhc-version)"
          want="t3code-lhc ${VERSION} (upstream $(node -p 'require("./lhc-release/version.json").upstreamTag'))"
          [ "$got" = "$want" ] || { echo "installed identity [$got] is not [$want]"; exit 1; }
          echo "installed: $got"
          cat "$prefix/receipt.json"
          scripts/install-lhc.sh --prefix "$prefix" | tee second.log
          grep -q "already at ${VERSION}" second.log
